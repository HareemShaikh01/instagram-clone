services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ubuntu
      POSTGRES_PASSWORD: ubuntu
      POSTGRES_DB: instagram
    volumes:
      - pgdata:/var/lib/postgresql
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ubuntu -d instagram"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    environment:
      DATABASE_URL: postgres://ubuntu:ubuntu@db:5432/instagram
      SESSION_SECRET: ${SESSION_SECRET:-local-dev-secret-change-me}
      MEDIA_DIR: /data/uploads
    ports:
      - "3003:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
